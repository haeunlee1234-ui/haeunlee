<!DOCTYPE html>
<html lang="ko">

<head>
    <title>DOM 스타일 변환</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            padding: 50px;
        }

        /* 타겟 문장 기본 스타일 */
        #target {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border: 2px solid #ccc;
            margin: 20px auto;
            width: 80%;
            transition: all 0.3s;
            /* 부드러운 전환 효과 */
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background -color: #eee;
            border: 1px solid #999;
            border-radius: 5px;
        }

        button:hover {
            background -color: #ddd;
        }
    </style>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>
</head>

<body>
    <p id="target">이 문장의 스타일을 바꿔보세요!</p>

    <br>

    <button onclick="changeColor()">글자색 변경</button>
    <button onclick="changeSize()">크게 보기</button>
    <button onclick="changebackground()">배경 강조</button>
    <button onclick="toggleVisibility()">숨기기/보이기</button>

</body>

</html>
