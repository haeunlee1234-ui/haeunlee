<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>
        키보드 자동차
    </title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }

        #car {
            position: absolute;
            left: 100px;
            top: 100px;
            width: 80px;
            height: 40px;
            background-color: #8e62c8;
            border: 2px solid #6e44b8;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 40px;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px;
            background: #eee;
            border: 1px solid #aaa;
        }
    </style>
    <script>
        var x = 100;
        var y = 100;
        var step = 10;

        window.onload = function () {
            var car = document.getElementById("car");
            var info = document.getElementById("info");
            document.onkeydown = function (e) {
                switch (e.keyCode) {
                    case 37:
                        x -= step;
                        break;
                    case 38:
                        y -= step;
                        break;
                    case 39:
                        x += step;
                        break;
                    case 40:
                        y += step;
                        break;
                }
                car.style.left = x + "px";
                car.style.top = y + "px";
                info.innerHTML = "현재 좌표 (x, y) = (" + x + ", " + y + ")";
            }
        }
    </script>
</head>

<body>
    <h3>실습 2: 키보드 자동차</h3>
    <p>방향키(←, ↑, →, ↓)를 눌러 자유롭게 운전해보세요.</p>
    <div id="car">Car</div>
    <div id="info">현재 좌표 (x, y) = (100, 100)</div>
</body>

</html>
